<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Energia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <audio id="bgMusic" src="musicafundo.mp3" autoplay loop></audio>

  <div id="game">
    <div id="board" class="board"></div>

    <div id="controls">
      <button id="rollBtn">🎲 Rodar Dado</button>
      <button id="toggleMusic">🔈 Música: Ligada</button>
      <span id="diceResult">Vez do Jogador 1</span>
    </div>

    <!-- Modal de Pergunta -->
    <div id="modal" class="hidden">
      <div id="questionContainer">
        <p id="questionText"></p>
        <button id="hintBtn">💡 Ver Dica</button>
        <p id="hintText" class="hidden"></p>
        <div id="options">
          <button class="optionBtn" data-option="A"></button>
          <button class="optionBtn" data-option="B"></button>
          <button class="optionBtn" data-option="C"></button>
        </div>
      </div>
    </div>

    <!-- Feedback customizado -->
    <div id="feedback" class="hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
