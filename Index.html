<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Corrida Verde - Jogo Educativo</title>
<style>
  /* Reset básico */
  * {
    box-sizing: border-box;
  }
  body, html {
    margin: 0; padding: 0;
    height: 100%;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%);
    overflow: hidden;
    user-select: none;
  }
  #game-container {
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 500px;
    margin: 1rem auto;
    border: 3px solid #4caf50;
    border-radius: 12px;
    background: #f0f9f4;
    box-shadow: 0 0 20px rgba(76,175,80,0.4);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: url('background_day.png') no-repeat center center/cover;
    border-radius: 12px;
  }

  /* Menus */
  .overlay {
    position: absolute;
    top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.65);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    z-index: 10;
    padding: 1rem;
  }
  .hidden {
    display: none;
  }
  h1, h2, h3 {
    margin-bottom: 1rem;
  }
  button {
    font-size: 1.1rem;
    padding: 0.75rem 1.5rem;
    margin: 0.5rem;
    border: none;
    border-radius: 8px;
    background-color: #4caf50;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s ease;
    min-width: 180px;
  }
  button:hover:not(:disabled) {
    background-color: #45a049;
  }
  button:disabled {
    background-color: #9e9e9e;
    cursor: not-allowed;
  }
  #device-selection button {
    min-width: 130px;
  }
  #vehicle-selection button {
    min-width: 150px;
  }

  #question-container {
    background: white;
    color: black;
    border-radius: 10px;
    padding: 1.5rem;
    max-width: 650px;
    width: 90%;
    box-shadow: 0 0 15px #4caf50;
    user-select: none;
  }
  #answers {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 1rem;
  }
  #answers button {
    margin: 0.4rem;
    flex: 1 1 45%;
    min-width: 140px;
  }

  /* Volume Control */
  #volume-control {
    position: absolute;
    top: 10px; right: 10px;
    z-index: 15;
    background: rgba(255,255,255,0.9);
    border-radius: 10px;
    padding: 0.4rem 0.8rem;
    display: flex;
    align-items: center;
    font-weight: bold;
    color: #4caf50;
    user-select: none;
  }
  #volume-control input[type=range] {
    margin-left: 10px;
    cursor: pointer;
  }

  /* Info bar */
  #info-bar {
    position: absolute;
    bottom: 8px;
    left: 8px;
    color: #2e7d32;
    font-weight: 600;
    font-size: 1.1rem;
    user-select: none;
    background: rgba(255 255 255 / 0.8);
    padding: 6px 12px;
    border-radius: 8px;
  }

  /* Responsive tweaks */
  @media (max-width: 600px) {
    #game-container {
      height: 350px;
      border-width: 2px;
    }
    button {
      min-width: 120px;
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
    }
    #answers button {
      flex: 1 1 100%;
    }
  }
</style>
</head>
<body>

<div id="game-container">

  <!-- Canvas do jogo -->
  <canvas id="gameCanvas" width="900" height="500" aria-label="Área do jogo Corrida Verde"></canvas>

  <!-- Tela de seleção de dispositivo -->
  <div id="device-selection" class="overlay">
    <h1>Corrida Verde</h1>
    <h3>Selecione seu dispositivo</h3>
    <div>
      <button id="btn-pc">Computador</button>
      <button id="btn-mobile">Celular</button>
    </div>
  </div>

  <!-- Tela de seleção de veículo -->
  <div id="vehicle-selection" class="overlay hidden" aria-live="polite" aria-atomic="true">
    <h2>Escolha seu veículo ecológico</h2>
    <button data-vehicle="solar">Carro Solar ☀️</button>
    <button data-vehicle="eolico">Carro Eólico 🌬️</button>
    <button data-vehicle="eletrico">Carro Elétrico ⚡</button>
  </div>

  <!-- Tela de perguntas -->
  <div id="question-screen" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="question-title">
    <div id="question-container">
      <h2 id="question-title"></h2>
      <div id="answers"></div>
    </div>
  </div>

  <!-- Tela de fim -->
  <div id="end-screen" class="overlay hidden" role="dialog" aria-modal="true">
    <h2>Fim da Corrida!</h2>
    <p id="end-message"></p>
    <button id="btn-restart">Jogar Novamente</button>
  </div>

  <!-- Controle de volume -->
  <div id="volume-control" aria-label="Controle de volume do jogo">
    Volume:
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" />
  </div>

  <!-- Barra de info (pontuação, energia, etc) -->
  <div id="info-bar" aria-live="polite" aria-atomic="true">
    Pontuação: 0 | Energia: 100%
  </div>
</div>

<!-- Áudios -->
<audio id="bgm" loop preload="auto" src="audio/musica.mp3"></audio>
<audio id="correctSound" preload="auto" src="audio/correto.mp3"></audio>
<audio id="wrongSound" preload="auto" src="audio/errado.mp3"></audio>

<script>
(() => {
  "use strict";

  // Constantes
  const CANVAS_WIDTH = 900;
  const CANVAS_HEIGHT = 500;

  // Estado geral do jogo
  const gameState = {
    device: null, // "pc" ou "mobile"
    vehicle: null, // "solar", "eolico", "eletrico"
    running: false,
    paused: false,
    player: {
      x: 50,
      y: 400,
      width: 60,
      height: 35,
      speed: 2.5,
      baseSpeed: 2.5,
      score: 0,
      energy: 100, // %
      color: '#4caf50',
    },
    opponents: [],
    currentQuestionIndex: 0,
    waitingAnswer: false,
    volume: 1,
    multiplayer: false,
    // multiplayer data placeholder
  };

  // Canvas e contexto
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Elementos UI
  const deviceSelection = document.getElementById('device-selection');
  const btnPC = document.getElementById('btn-pc');
  const btnMobile = document.getElementById('btn-mobile');

  const vehicleSelection = document.getElementById('vehicle-selection');

  const questionScreen = document.getElementById('question-screen');
  const questionTitle = document.getElementById('question-title');
  const answersContainer = document.getElementById('answers');

  const endScreen = document.getElementById('end-screen');
  const endMessage = document.getElementById('end-message');
  const btnRestart = document.getElementById('btn-restart');

  const volumeSlider = document.getElementById('volume-slider');
  const infoBar = document.getElementById('info-bar');

  // Áudios
  const bgm = document.getElementById('bgm');
  const correctSound = document.getElementById('correctSound');
  const wrongSound = document.getElementById('wrongSound');

  // Perguntas (pode ser estendido/removido)
  const questions = [
    {
      question: 'Qual destas fontes é renovável?',
      options: ['Carvão', 'Petróleo', 'Energia Solar', 'Gás Natural'],
      answer: 2,
      explanation: 'Correto! A energia solar é renovável porque vem do sol.'
    },
    {
      question: 'O que é eficiência energética?',
      options: ['Usar mais energia', 'Evitar energia limpa', 'Fazer mais com menos energia', 'Usar apenas combustíveis'],
      answer: 2,
      explanation: 'Correto! Eficiência energética é fazer mais usando menos energia.'
    },
    {
      question: 'Qual destas ações ajuda a economizar energia?',
      options: ['Deixar luzes acesas', 'Desligar aparelhos sem uso', 'Usar ar condicionado sempre', 'Ligar a televisão o dia todo'],
      answer: 1,
      explanation: 'Correto! Desligar aparelhos sem uso ajuda a economizar energia.'
    }
  ];

  // Carros/oponentes para o jogador
  const vehicleColors = {
    solar: '#f9d71c',
    eolico: '#4caf50',
    eletrico: '#2196f3',
  };

  // Oponente representa energia não renovável (mais lento e constante)
  class Opponent {
    constructor(y, speed) {
      this.x = 50;
      this.y = y;
      this.width = 60;
      this.height = 35;
      this.speed = speed;
      this.color = '#6e6e6e';
    }
    update() {
      this.x += this.speed;
      if (this.x > CANVAS_WIDTH + this.width) this.x = -this.width;
    }
    draw(ctx) {
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x, this.y, this.width, this.height);
      // pode melhorar aqui com sprites
    }
  }

  // Inicia o jogo após seleção de veículo
  function startGame() {
    if (!gameState.vehicle || gameState.running) return;
    deviceSelection.classList.add('hidden');
    vehicleSelection.classList.add('hidden');
    endScreen.classList.add('hidden');
    questionScreen.classList.add('hidden');
    gameState.running = true;
    gameState.player.speed = gameState.player.baseSpeed;
    gameState.player.x = 50;
    gameState.player.score = 0;
    gameState.player.energy = 100;
    gameState.currentQuestionIndex = 0;
    gameState.waitingAnswer = false;
    // Inicializa o player color conforme veículo escolhido
    gameState.player.color = vehicleColors[gameState.vehicle] || '#4caf50';

    // Cria 2 oponentes
    gameState.opponents = [
      new Opponent(320, 1.5),
      new Opponent(360, 1.2),
    ];

    // Tocar música de fundo (prevenir autoplay bloqueado)
    bgm.volume = gameState.volume;
    bgm.play().catch(() => {});

    updateInfoBar();
    requestAnimationFrame(gameLoop);
  }

  // Atualiza barra info
  function updateInfoBar() {
    infoBar.textContent = `Pontuação: ${gameState.player.score} | Energia: ${gameState.player.energy.toFixed(0)}%`;
  }

  // Mostrar perguntas
  function showQuestion() {
    if (gameState.currentQuestionIndex >= questions.length) return;
    gameState.waitingAnswer = true;
    gameState.running = false;

    const q = questions[gameState.currentQuestionIndex];
    questionTitle.textContent = q.question;
    answersContainer.innerHTML = '';

    q.options.forEach((option, i) => {
      const btn = document.createElement('button');
      btn.textContent = option;
      btn.disabled = false;
      btn.addEventListener('click', () => {
        if (!gameState.waitingAnswer) return;
        gameState.waitingAnswer = false;
        checkAnswer(i);
      });
      answersContainer.appendChild(btn);
    });

    questionScreen.classList.remove('hidden');
  }

  // Checar resposta
  function checkAnswer(selectedIndex) {
    questionScreen.classList.add('hidden');
    const currentQ = questions[gameState.currentQuestionIndex];

    if (selectedIndex === currentQ.answer) {
      // Acertou
      gameState.player.speed = Math.min(gameState.player.speed + 0.7, 7);
      gameState.player.score++;
      gameState.player.energy = Math.min(gameState.player.energy + 10, 100);
      correctSound.volume = gameState.volume;
      correctSound.play().catch(() => {});
      alert(currentQ.explanation);
    } else {
      // Errou
      gameState.player.speed = Math.max(gameState.player.speed - 1.2, 1);
      gameState.player.energy = Math.max(gameState.player.energy - 20, 0);
      wrongSound.volume = gameState.volume;
      wrongSound.play().catch(() => {});
      alert('Resposta incorreta. Tente novamente!');
    }

    gameState.currentQuestionIndex++;
    gameState.running = true;
    updateInfoBar();
    requestAnimationFrame(gameLoop);
  }

  // Função principal do loop
  function gameLoop() {
    if (!gameState.running) return;

    // Limpar tela
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Desenhar pista simples
    drawTrack();

    // Atualiza e desenha o jogador
    updatePlayer();
    drawPlayer();

    // Atualiza e desenha oponentes
    gameState.opponents.forEach(op => {
      op.update();
      op.draw(ctx);
    });

    updateInfoBar();

    // Checar se jogador chegou no final
    if (gameState.player.x >= CANVAS_WIDTH - gameState.player.width - 10) {
      endGame();
      return;
    }

    // Verificar checkpoints de perguntas
    const checkpoints = questions.length;
    for (let i = 0; i < checkpoints; i++) {
      let checkpointPos = (CANVAS_WIDTH / (checkpoints + 1)) * (i + 1);
      if (gameState.player.x >= checkpointPos && gameState.currentQuestionIndex === i && !gameState.waitingAnswer) {
        showQuestion();
        return;
      }
    }

    requestAnimationFrame(gameLoop);
  }

  // Desenha a pista - simples faixa verde com linhas divisórias
  function drawTrack() {
    ctx.fillStyle = '#a3d9a5';
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Linhas divisórias brancas
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 3;
    const laneHeight = 80;
    for (let y = 220; y <= 400; y += laneHeight) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(CANVAS_WIDTH, y);
      ctx.stroke();
    }
  }

  // Atualiza posição do jogador
  function updatePlayer() {
    gameState.player.x += gameState.player.speed;

    // Reduz energia conforme velocidade
    gameState.player.energy -= gameState.player.speed * 0.03;
    if (gameState.player.energy < 0) {
      gameState.player.energy = 0;
      // Se energia zerou, jogador diminui velocidade
      gameState.player.speed = Math.max(gameState.player.speed - 0.05, 0.3);
    }
  }

  // Desenha jogador no canvas
  function drawPlayer() {
    ctx.fillStyle = gameState.player.color;
    ctx.fillRect(gameState.player.x, gameState.player.y, gameState.player.width, gameState.player.height);

    // Desenho simples para diferenciar os veículos
    ctx.fillStyle = 'white';
    ctx.font = '18px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(gameState.vehicle ? gameState.vehicle.toUpperCase() : '???', gameState.player.x + gameState.player.width / 2, gameState.player.y + gameState.player.height / 2 + 6);
  }

  // Finaliza jogo
  function endGame() {
    gameState.running = false;
    bgm.pause();
    endMessage.textContent = `Você terminou a corrida com ${gameState.player.score} ponto${gameState.player.score !== 1 ? 's' : ''}!`;
    endScreen.classList.remove('hidden');
  }

  // Reinicia o jogo
  function restartGame() {
    endScreen.classList.add('hidden');
    gameState.currentQuestionIndex = 0;
    gameState.player.x = 50;
    gameState.player.score = 0;
    gameState.player.energy = 100;
    gameState.player.speed = gameState.player.baseSpeed;
    gameState.running = true;
    bgm.currentTime = 0;
    bgm.play().catch(() => {});
    updateInfoBar();
    requestAnimationFrame(gameLoop);
  }

  // Ajusta volume do som
  function setVolume(vol) {
    gameState.volume = vol;
    bgm.volume = vol;
    correctSound.volume = vol;
    wrongSound.volume = vol;
  }

  // Eventos UI

  // Escolha de dispositivo
  btnPC.addEventListener('click', () => {
    gameState.device = 'pc';
    deviceSelection.classList.add('hidden');
    vehicleSelection.classList.remove('hidden');
  });
  btnMobile.addEventListener('click', () => {
    gameState.device = 'mobile';
    deviceSelection.classList.add('hidden');
    vehicleSelection.classList.remove('hidden');
  });

  // Escolha de veículo
  vehicleSelection.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      gameState.vehicle = btn.getAttribute('data-vehicle');
      vehicleSelection.classList.add('hidden');
      startGame();
    });
  });

  // Reiniciar jogo
  btnRestart.addEventListener('click', restartGame);

  // Controle de volume
  volumeSlider.addEventListener('input', (e) => setVolume(parseFloat(e.target.value)));

  // Inicia volume padrão
  setVolume(parseFloat(volumeSlider.value));

  // Prevenir clique ou scroll acidental fora dos botões no mobile
  window.addEventListener('touchmove', e => {
    if (gameState.waitingAnswer) e.preventDefault();
  }, { passive: false });

  // Teclado para PC - controle simples: seta para cima = boost pequeno, seta para baixo = reduzir velocidade
  window.addEventListener('keydown', e => {
    if (!gameState.running) return;
    if (gameState.device !== 'pc') return;
    if (gameState.waitingAnswer) return;

    if (e.key === 'ArrowUp') {
      gameState.player.speed = Math.min(gameState.player.speed + 0.3, 7);
    }
    if (e.key === 'ArrowDown') {
      gameState.player.speed = Math.max(gameState.player.speed - 0.5, 1);
    }
  });

  // Placeholder básico para multiplayer com Socket.IO (deve ser implementado no servidor e cliente)
  /*
  let socket = io();

  socket.on('connect', () => {
    console.log('Conectado ao servidor multiplayer');
  });

  // Enviar posição atual do jogador
  function sendPlayerState() {
    socket.emit('playerMove', {
      x: gameState.player.x,
      score: gameState.player.score,
      vehicle: gameState.vehicle
    });
  }

  // Receber estado dos outros jogadores
  socket.on('updatePlayers', players => {
    // Atualizar estado dos oponentes multiplayer
  });

  // Iniciar conexão multiplayer, sincronizar estado etc
  */

})();
</script>

</body>
</html>
