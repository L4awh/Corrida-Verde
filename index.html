<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Tabuleiro - Energia Sustentável</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="game-header">
            <h1><i class="fas fa-leaf"></i> Energia Sustentável</h1>
            <div class="audio-controls">
                <button id="musicToggle" class="audio-btn">
                    <i class="fas fa-volume-up"></i>
                </button>
                <input type="range" id="volumeSlider" min="0" max="100" value="50" class="volume-slider">
            </div>
        </header>

        <!-- Game Info Panel -->
        <div class="game-info">
            <div class="current-player">
                <h3>Vez do Jogador: <span id="currentPlayerDisplay">1</span></h3>
                <div class="player-indicator" id="playerIndicator"></div>
            </div>
            <div class="dice-section">
                <div class="dice" id="dice">
                    <i class="fas fa-dice-one"></i>
                </div>
                <button id="rollDiceBtn" class="roll-btn">
                    <i class="fas fa-dice"></i> Rodar Dado
                </button>
            </div>
        </div>

        <!-- Game Board -->
        <div class="board-container">
            <div class="board" id="gameBoard">
                <!-- Squares will be generated by JavaScript -->
            </div>
        </div>

        <!-- Question Modal -->
        <div class="question-modal" id="questionModal">
            <div class="modal-content">
                <div class="question-header">
                    <h3 id="questionTitle">Pergunta sobre Energia Sustentável</h3>
                    <div class="difficulty-badge" id="difficultyBadge">Fácil</div>
                </div>
                <div class="question-text" id="questionText"></div>
                <div class="question-options">
                    <button class="option-btn" data-option="A" id="optionA"></button>
                    <button class="option-btn" data-option="B" id="optionB"></button>
                    <button class="option-btn" data-option="C" id="optionC"></button>
                </div>
                <div class="question-actions">
                    <button class="hint-btn" id="hintBtn">
                        <i class="fas fa-lightbulb"></i> Dica
                    </button>
                </div>
                <div class="hint-text" id="hintText" style="display: none;"></div>
                <div class="question-result" id="questionResult"></div>
            </div>
        </div>

        <!-- Win Modal -->
        <div class="win-modal" id="winModal">
            <div class="modal-content">
                <div class="win-content">
                    <i class="fas fa-trophy"></i>
                    <h2>Parabéns!</h2>
                    <p id="winMessage"></p>
                    <button class="restart-btn" id="restartBtn">
                        <i class="fas fa-redo"></i> Jogar Novamente
                    </button>
                </div>
            </div>
        </div>

        <!-- Player Legend -->
        <div class="player-legend">
            <div class="player-info">
                <div class="token player1-token"></div>
                <span>Jogador 1</span>
            </div>
            <div class="player-info">
                <div class="token player2-token"></div>
                <span>Jogador 2</span>
            </div>
            <div class="player-info">
                <div class="token player3-token"></div>
                <span>Jogador 3</span>
            </div>
        </div>
    </div>

    <audio id="backgroundMusic" loop>
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmEcBSuM2/DJdSU=" type="audio/wav">
    </audio>

    <script src="script.js"></script>
</body>
</html>
